# Starts a local MongoDB for development:   docker compose up -d
# Then use MONGO_URI=mongodb://127.0.0.1:27017/sahakari_ledger in server/.env
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
